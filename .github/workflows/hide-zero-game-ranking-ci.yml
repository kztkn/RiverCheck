name: Hide zero-game ranking validation

on:
  push:
    branches:
      - fix/hide-zero-game-ranking

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.head_commit.message != 'ランキングから参加0回を除外'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply patch
        run: python scripts/apply_hide_zero_game_ranking_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary validation files
        run: |
          rm -f scripts/apply_hide_zero_game_ranking_patch.py
          rm -f .github/workflows/hide-zero-game-ranking-ci.yml

      - name: Commit validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ランキングから参加0回を除外'
          git push origin HEAD:fix/hide-zero-game-ranking
