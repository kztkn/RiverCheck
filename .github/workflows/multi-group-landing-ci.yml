name: multi-group-landing-ci

on:
  push:
    branches:
      - feat/multi-group-core

permissions:
  contents: write

jobs:
  verify-and-update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/patch-multi-group-docs.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit canonical docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/requirements.md docs/architecture.md docs/TODO.md
          git commit -m "複数グループ仕様を正本文書へ反映 [skip ci]"
          git push
