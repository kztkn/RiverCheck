name: Implement LIVE TABLE interactions

on:
  push:
    branches:
      - feat/live-table-interactions

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply LIVE TABLE implementation
        shell: bash
        run: |
