name: Implement LIVE TABLE interactions

on:
  push:
    branches:
      - feat/live-table-interactions

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply LIVE TABLE implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64

          def r(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          Path("app/components/table-now.tsx").write_bytes(base64.b64decode(""))
          Path("app/styles/table-now.css").write_bytes(base64.b64decode(""))
          Path("app/routes/live-table-ui.test.ts").write_bytes(base64.b64decode(""))

          r("app/routes/game-participant.tsx",
            'import { TableNow } from "~/components/table-now";\n',
            'import { TableNow } from "~/components/table-now";\nimport { listOpenGameTableEvents } from "@server/repositories/table-event-repository.server";\n')
          r("app/routes/game-participant.tsx",
            '  const [participant, participantRoster, tableEventCounts] = await Promise.all([\n',
            '  const [participant, participantRoster, tableEventCounts, tableEvents] = await Promise.all([\n')
          r("app/routes/game-participant.tsx",
            '    context.game.status === "open"\n      ? getOpenGameTableEventCounts(context.group.id, params.gameId)\n      : Promise.resolve({ allInCount: 0, bombPotCount: 0, sevenDeuceCount: 0 }),\n  ]);\n',
            '    context.game.status === "open"\n      ? getOpenGameTableEventCounts(context.group.id, params.gameId)\n      : Promise.resolve({ allInCount: 0, bombPotCount: 0, sevenDeuceCount: 0 }),\n    context.game.status === "open"\n      ? listOpenGameTableEvents(context.group.id, params.gameId, 100)\n      : Promise.resolve([]),\n  ]);\n')
          r("app/routes/game-participant.tsx",
            '          ...tableEventCounts,\n        }\n',
            '          ...tableEventCounts,\n          events: tableEvents.map((event) => ({\n            id: event.id,\n            type: event.type,\n            recordedAt: event.recordedAt,\n            subject: event.subject ? { displayName: event.subject.displayName } : null,\n            players: event.players.map((player) => ({\n              displayName: player.displayName,\n              isWinner: player.isWinner,\n            })),\n          })),\n        }\n')
          r("app/routes/game-participant.tsx",
            '  const [isEditing, setIsEditing] = useState(false);\n',
            '  const [isEditing, setIsEditing] = useState(false);\n  const [rosterOpenSignal, setRosterOpenSignal] = useState(0);\n')
          r("app/routes/game-participant.tsx",
            '      {loaderData.tableNow ? <TableNow data={loaderData.tableNow} /> : null}\n',
            '      {loaderData.tableNow ? (\n        <TableNow\n          data={loaderData.tableNow}\n          onPlayersClick={loaderData.participant ? () => setRosterOpenSignal((value) => value + 1) : undefined}\n        />\n      ) : null}\n')
          r("app/routes/game-participant.tsx",
            '          <ParticipantRosterSheet\n            available={loaderData.participantRoster.available}\n            items={loaderData.participantRoster.items}\n',
            '          <ParticipantRosterSheet\n            available={loaderData.participantRoster.available}\n            externalOpenSignal={rosterOpenSignal}\n            hideTrigger\n            items={loaderData.participantRoster.items}\n')
          r("app/routes/game-participant.tsx",
            'export function ParticipantRosterSheet({\n  available,\n  items,\n  onOpen,\n  statusFetcher,\n}: {\n  available: boolean;\n  items: ParticipantRosterItem[];\n  onOpen?: () => void;\n  statusFetcher?: ParticipantStatusFetcher;\n}) {\n',
            'export function ParticipantRosterSheet({\n  available,\n  externalOpenSignal = 0,\n  hideTrigger = false,\n  items,\n  onOpen,\n  statusFetcher,\n}: {\n  available: boolean;\n  externalOpenSignal?: number;\n  hideTrigger?: boolean;\n  items: ParticipantRosterItem[];\n  onOpen?: () => void;\n  statusFetcher?: ParticipantStatusFetcher;\n}) {\n')
          r("app/routes/game-participant.tsx",
            '  function startStatusEdit() {\n',
            '  useEffect(() => {\n    if (externalOpenSignal <= 0) return;\n    openSheet();\n  }, [externalOpenSignal]);\n\n  function startStatusEdit() {\n')
          r("app/routes/game-participant.tsx",
            '      <button\n        aria-controls="participant-roster-dialog"\n        aria-expanded={isOpen}\n        aria-haspopup="dialog"\n        className="participant-roster-trigger"\n        onClick={openSheet}\n        ref={triggerRef}\n        type="button"\n      >\n        <span>\n          参加者 <strong>{countLabel}</strong>\n        </span>\n        <small>一覧を見る</small>\n      </button>\n',
            '      {hideTrigger ? null : (\n        <button\n          aria-controls="participant-roster-dialog"\n          aria-expanded={isOpen}\n          aria-haspopup="dialog"\n          className="participant-roster-trigger"\n          onClick={openSheet}\n          ref={triggerRef}\n          type="button"\n        >\n          <span>\n            参加者 <strong>{countLabel}</strong>\n          </span>\n          <small>一覧を見る</small>\n        </button>\n      )}\n')

          r("app/routes/group-top.tsx",
            'import { GroupSiteHeader } from "~/components/site-menu";\n',
            'import { GroupSiteHeader } from "~/components/site-menu";\nimport { LiveTableMini } from "~/components/table-now";\n')
          r("app/routes/group-top.tsx",
            '  const overview = await getGroupOverview(params.groupCode);\n  if (!overview) throw new Response("Group not found", { status: 404 });\n  return overview;\n',
            '  const overview = await getGroupOverview(params.groupCode);\n  if (!overview) throw new Response("Group not found", { status: 404 });\n  const primaryGame = orderActiveGamesBySchedule(overview.games)[0];\n  const liveTable = primaryGame?.status === "open"\n    ? await import("@server/repositories/participant-repository.server").then(async ({ getOpenGameTableEventCounts }) => ({\n        gameId: primaryGame.id,\n        playerCount: primaryGame.participantCount,\n        ...(await getOpenGameTableEventCounts(overview.group.id, primaryGame.id)),\n      }))\n    : null;\n  return { ...overview, liveTable };\n')
          r("app/routes/group-top.tsx",
            '  const { group, games } = loaderData;\n',
            '  const { group, games, liveTable } = loaderData;\n')
          r("app/routes/group-top.tsx",
            '                </div>\n              </div>\n              <Link\n                className="button button-primary home-game-primary-action"\n',
            '                </div>\n                {liveTable && liveTable.gameId === primaryGame.id ? (\n                  <LiveTableMini data={liveTable} to={`games/${primaryGame.id}`} />\n                ) : null}\n              </div>\n              <Link\n                className="button button-primary home-game-primary-action"\n')

          p = Path("app/routes/game-participant.test.ts")
          t = p.read_text()
          t = t.replace('  listResultRevisions: vi.fn(),\n', '  listResultRevisions: vi.fn(),\n  listOpenGameTableEvents: vi.fn(),\n', 1)
          anchor = 'vi.mock("@server/repositories/group-paypay-repository.server", () => ({\n'
          mock = 'vi.mock("@server/repositories/table-event-repository.server", () => ({\n  listOpenGameTableEvents: mocked.listOpenGameTableEvents,\n}));\n'
          if anchor not in t: raise SystemExit("test mock anchor missing")
          t = t.replace(anchor, mock + anchor, 1)
          t = t.replace('    mocked.listResultRevisions.mockResolvedValue([]);\n', '    mocked.listResultRevisions.mockResolvedValue([]);\n    mocked.listOpenGameTableEvents.mockResolvedValue([]);\n', 1)
          p.write_text(t)

          p = Path("docs/requirements.md")
          t = p.read_text()
          old = '15. open開催の参加者ページでは開催タイトル直下に「TABLE NOW / いまの卓」を表示し、現在参加中の人数を常時表示する。ALL IN・BOMB POT・72o成立は取消されていないテーブルイベントの累計が1件以上の項目だけ表示する。リバイ数は含めない。狭いスマートフォン幅では各指標を横スクロールでき、1項目内の不自然な改行を避ける。draft・finalizedでは表示しない。ページ表示・フォーカス復帰・pageshowおよびテーブルイベントの記録/取消後の既存loader再検証で最新値へ同期し、常時ポーリングやWebSocketは導入しない'
          new = '15. open開催の参加者ページでは開催タイトル直下に「LIVE TABLE」を表示し、現在参加中の人数を常時表示する。PLAYERSを押すと既存の参加者一覧を開き、従来の参加者一覧トリガーは重複表示しない。ALL IN・BOMB POT・72o成立は取消されていないテーブルイベントの累計が1件以上の項目だけ表示し、押すとその種別の記録詳細を確認できる。リバイ数は含めない。狭いスマートフォン幅では各指標を横スクロールでき、1項目内の不自然な改行を避ける。draft・finalizedでは表示しない。グループTOPのNEXT TABLE主開催がopenの場合はカード内にもミニLIVE TABLEを表示し、開催画面へ遷移できる。ページ表示・フォーカス復帰・pageshowおよびテーブルイベントの記録/取消後の既存loader再検証で最新値へ同期し、常時ポーリングやWebSocketは導入しない'
          if old not in t: raise SystemExit("requirements anchor missing")
          p.write_text(t.replace(old, new, 1))

          Path(".github/workflows/live-table-implementation.yml").unlink()
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "LIVE TABLEの詳細導線とトップ表示を追加"
          git push origin HEAD:feat/live-table-interactions
