name: Fix admin and participant UX
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/routes/game-admin.tsx')
          s = p.read_text()
          old = '''      {finalization.participantCount < 4 ? (\n        <p className="warning-notice">\n          結果確定には4人以上必要です。現在は\n          {finalization.participantCount}人です。\n        </p>\n      ) : null}'''
          new = '''      {finalization.participantCount < 2 ? (\n        <p className="warning-notice">\n          結果確定には2人以上必要です。現在は\n          {finalization.participantCount}人です。\n        </p>\n      ) : null}'''
          assert old in s
          s = s.replace(old, new)

          old = '''    const published = await publishSettlementPlan(\n      authorized.group.id,\n      params.gameId,\n      validation.input,\n    );\n    if (!published) {'''
          new = '''    let published = false;\n    try {\n      published = await publishSettlementPlan(\n        authorized.group.id,\n        params.gameId,\n        validation.input,\n      );\n    } catch (error) {\n      console.error("Failed to publish settlement plan", error);\n      return {\n        ok: false as const,\n        intent: "publish-settlement-plan" as const,\n        error: "精算予定を公開できませんでした。画面を更新してもう一度お試しください。",\n        errors: {},\n        values,\n      };\n    }\n    if (!published) {'''
          assert old in s
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('app/routes/game-participant.tsx')
          s = p.read_text()
          duplicate = '''          {loaderData.game.settlementPlanPublishedAt && loaderData.game.costShares ? (\n            <SettlementPlanSheet\n              costShares={loaderData.game.costShares}\n              participantCount={loaderData.game.previewParticipantCount}\n              venueCost={loaderData.game.venueCost}\n            />\n          ) : null}\n          {loaderData.game.settlementPlanPublishedAt && loaderData.game.costShares ? (\n            <SettlementPlanSheet\n              costShares={loaderData.game.costShares}\n              participantCount={loaderData.game.previewParticipantCount}\n              venueCost={loaderData.game.venueCost}\n            />\n          ) : null}'''
          single = '''          {loaderData.game.settlementPlanPublishedAt && loaderData.game.costShares ? (\n            <SettlementPlanSheet\n              costShares={loaderData.game.costShares}\n              participantCount={loaderData.game.previewParticipantCount}\n              venueCost={loaderData.game.venueCost}\n            />\n          ) : null}'''
          assert duplicate in s
          s = s.replace(duplicate, single)

          marker = '''          <LocalRulesSheet\n            bombPotRuleEnabled={loaderData.game.bombPotRuleEnabled}\n            sevenDeuceRuleEnabled={loaderData.game.sevenDeuceRuleEnabled}\n          />\n\n          {loaderData.participant.status === "submitted" && !isEditing ? ('''
          replacement = '''          <LocalRulesSheet\n            bombPotRuleEnabled={loaderData.game.bombPotRuleEnabled}\n            sevenDeuceRuleEnabled={loaderData.game.sevenDeuceRuleEnabled}\n          />\n          {loaderData.game.settlementPlanPublishedAt && loaderData.game.costShares ? (\n            <SettlementPlanSheet\n              costShares={loaderData.game.costShares}\n              participantCount={loaderData.game.previewParticipantCount}\n              venueCost={loaderData.game.venueCost}\n            />\n          ) : null}\n\n          {loaderData.participant.status === "submitted" && !isEditing ? ('''
          assert marker in s
          s = s.replace(marker, replacement)
          p.write_text(s)

          p = Path('app/components/table-event-recorder.tsx')
          s = p.read_text()
          old = '''      <button\n        className="table-event-trigger"\n        onClick={openRecorder}\n        ref={triggerRef}\n        type="button"\n      >\n        <span aria-hidden="true">＋</span>\n        テーブルイベント\n      </button>'''
          new = '''      <div className="table-event-fixed-layer" aria-hidden={isOpen ? "true" : undefined}>\n        <button\n          className="table-event-trigger"\n          onClick={openRecorder}\n          ref={triggerRef}\n          type="button"\n        >\n          <span aria-hidden="true">＋</span>\n          テーブルイベント\n        </button>\n      </div>'''
          assert old in s
          p.write_text(s.replace(old, new))

          p = Path('app/styles/table-events.css')
          s = p.read_text()
          old = '''.table-event-trigger {\n  position: fixed;\n  z-index: 34;\n  right: max(16px, env(safe-area-inset-right));\n  bottom: max(18px, calc(env(safe-area-inset-bottom) + 12px));'''
          new = '''.table-event-fixed-layer {\n  position: fixed;\n  z-index: 34;\n  inset: 0;\n  width: 100vw;\n  height: 100dvh;\n  pointer-events: none;\n}\n\n.table-event-trigger {\n  position: absolute;\n  right: max(16px, env(safe-area-inset-right));\n  bottom: max(18px, calc(env(safe-area-inset-bottom) + 12px));\n  pointer-events: auto;'''
          assert old in s
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('app/routes/settlement-plan-publication.test.ts')
          if p.exists():
            s = p.read_text()
            if 'seated participants also see the published plan' not in s:
              s += '''\n\nit("seated participants also see the published plan", () => {\n  const source = readFileSync("app/routes/game-participant.tsx", "utf8");\n  expect((source.match(/<SettlementPlanSheet/g) ?? []).length).toBeGreaterThanOrEqual(2);\n});\n'''
              p.write_text(s)

          Path('app/routes/two-player-admin-guard.test.ts').write_text('''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\n\ndescribe("two-player admin finalization copy", () => {\n  it("does not retain the legacy four-player guard", () => {\n    const source = readFileSync("app/routes/game-admin.tsx", "utf8");\n    expect(source).not.toContain("結果確定には4人以上必要です");\n    expect(source).toContain("finalization.participantCount < 2");\n  });\n});\n''')
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-admin-prod.yml
          git add app
          git commit -m '2人確定と精算公開・テーブルイベント表示を修正'
          git push origin HEAD:main
