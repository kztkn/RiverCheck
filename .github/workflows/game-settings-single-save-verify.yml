name: game-settings-single-save-verify

on:
  push:
    branches:
      - fix/game-settings-single-save

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/game-settings-single-save
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/combine-game-settings-save.py
      - run: git diff --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit applied changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/game-admin.tsx app/routes/game-admin-management.test.ts server/repositories/game-repository.server.ts server/services/game-service.server.ts
          git commit -m "開催設定を一度に保存して閉じる"
          git push origin HEAD:fix/game-settings-single-save
