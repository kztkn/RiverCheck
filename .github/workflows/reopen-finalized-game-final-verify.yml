name: reopen-finalized-game-final-verify

on:
  push:
    branches:
      - feat/reopen-finalized-game

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reopen-finalized-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/fix-reopen-lock-order.py
      - run: git diff --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit lock-order fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/finalization-service.server.ts app/routes/finalization-reopen.test.ts
          git commit -m "確定取消と会費受取の競合を防ぐ"
          git push origin HEAD:feat/reopen-finalized-game
