name: published-settlement-plan-ci

on:
  push:
    branches:
      - feat/published-settlement-plan-work

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '精算予定公開の実装と検証完了') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rivercheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rivercheck
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python .github/scripts/apply-published-settlement-plan.py
      - run: npm ci
      - run: npm run db:migrate:local
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/published-settlement-plan-ci.yml .github/scripts/apply-published-settlement-plan.py
          git add migrations/0028_add_settlement_plan_published_at.sql types/game.ts server/repositories/game-repository.server.ts server/repositories/finalization-repository.server.ts app/routes/game-admin.tsx app/routes/game-participant.tsx app/routes/settlement-plan-publication.test.ts docs/requirements.md docs/domain-rules.md
          git commit -m "精算予定公開の実装と検証完了"
          git push origin HEAD:feat/published-settlement-plan-work
