name: device-player-switch-ci

on:
  push:
    branches:
      - feat/device-player-switch

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/device-player-switch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/apply-device-player-switch.mjs
      - run: git diff --check
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run app/routes/site-menu-access.test.ts app/routes/player-choice-list-confirmation.test.ts
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/site-menu.tsx app/components/player-choice-list.tsx app/routes/stats-player.tsx app/routes/site-menu-access.test.ts app/routes/player-choice-list-confirmation.test.ts app/styles/profile.css docs/requirements.md
          git commit -m "端末プレイヤー変更導線を追加"
          git push origin HEAD:feat/device-player-switch
