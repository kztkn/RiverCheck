name: Table events verify

on:
  push:
    branches:
      - feat/table-events-v1
    paths:
      - .github/workflows/table-events-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/table-events-v1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python scripts/apply-table-event-requirements.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified requirements and remove temporary files
        run: |
          rm .github/workflows/table-events-verify.yml
          rm scripts/apply-table-event-requirements.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "卓イベント仕様を反映して検証"
          git push origin HEAD:feat/table-events-v1

# retry after timeline type narrowing fix
