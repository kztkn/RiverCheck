name: Dialog and table-event copy verify

on:
  push:
    branches:
      - ui/center-dialogs-table-event-copy
    paths:
      - .github/workflows/dialog-copy-ui-verify.yml
      - scripts/apply-dialog-copy-ui.py

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/center-dialogs-table-event-copy
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python scripts/apply-dialog-copy-ui.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified UI changes and remove temporary files
        run: |
          rm .github/workflows/dialog-copy-ui-verify.yml
          rm scripts/apply-dialog-copy-ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "参加画面の確認UIとテーブルイベント表記を整理"
          git push origin HEAD:ui/center-dialogs-table-event-copy
