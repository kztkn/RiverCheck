name: relocate-game-date-settings

on:
  push:
    branches:
      - fix/game-settings-date-placement

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/game-settings-date-placement
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/relocate-game-date-settings.py
      - run: git diff --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit applied changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/game-admin.tsx app/routes/group-manage.tsx app/routes/game-admin-management.test.ts app/styles/groups.css
          git commit -m "開催日変更を開催設定へ移動"
          git push origin HEAD:fix/game-settings-date-placement
