name: settlement-preview-draft-ci

on:
  push:
    branches:
      - feat/settlement-preview-draft

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settlement-preview-draft
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply patch
        run: |
          python scripts/apply_settlement_preview_draft.py
          python scripts/fix_settlement_preview_draft_test.py
      - name: Remove temporary tooling
        run: rm scripts/apply_settlement_preview_draft.py scripts/fix_settlement_preview_draft_test.py .github/workflows/settlement-preview-draft-ci.yml
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "精算プレビューを端末内に自動保存 [skip ci]"
          git push origin HEAD:feat/settlement-preview-draft
