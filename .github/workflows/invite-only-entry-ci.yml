name: invite-only-entry-ci

on:
  push:
    branches:
      - feat/invite-only-entry

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/invite-only-entry
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/refine-invite-result-access.mjs
      - run: git diff --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit patched implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/game-participant.tsx docs/requirements.md docs/architecture.md
          git commit -m "結果閲覧ガードを既存参加者へ対応"
          git push origin HEAD:feat/invite-only-entry
