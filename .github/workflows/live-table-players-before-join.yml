name: Verify LIVE TABLE players before join
on:
  push:
    branches: [fix/live-table-players-before-join-v2]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Enable PLAYERS before join
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/routes/game-participant.tsx')
          s = p.read_text()
          old = '''      {loaderData.tableNow ? (\n        <TableNow\n          data={loaderData.tableNow}\n          onPlayersClick={loaderData.participant ? () => setRosterOpenSignal((value) => value + 1) : undefined}\n        />\n      ) : null}\n'''
          new = '''      {loaderData.tableNow ? (\n        <>\n          <TableNow\n            data={loaderData.tableNow}\n            onPlayersClick={() => setRosterOpenSignal((value) => value + 1)}\n          />\n          <ParticipantRosterSheet\n            available={loaderData.participantRoster.available}\n            externalOpenSignal={rosterOpenSignal}\n            hideTrigger\n            items={loaderData.participantRoster.items}\n            onOpen={() => {\n              if (revalidator.state === \"idle\") {\n                void revalidator.revalidate();\n              }\n            }}\n            statusFetcher={loaderData.participant ? statusFetcher : undefined}\n          />\n        </>\n      ) : null}\n'''
          if old not in s:
              raise SystemExit('LIVE TABLE block not found')
          s = s.replace(old, new, 1)
          old_roster = '''          <ParticipantRosterSheet\n            available={loaderData.participantRoster.available}\n            externalOpenSignal={rosterOpenSignal}\n            hideTrigger\n            items={loaderData.participantRoster.items}\n            onOpen={() => {\n              if (revalidator.state === \"idle\") {\n                void revalidator.revalidate();\n              }\n            }}\n            statusFetcher={statusFetcher}\n          />\n\n'''
          if old_roster not in s:
              raise SystemExit('participant roster block not found')
          s = s.replace(old_roster, '', 1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified change
        run: |
          rm .github/workflows/live-table-players-before-join.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '参加前でもLIVE TABLEから参加者を確認可能にする'
          git push origin HEAD:fix/live-table-players-before-join-v2
