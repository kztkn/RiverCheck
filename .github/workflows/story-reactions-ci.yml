name: Story reactions validation

on:
  push:
    branches:
      - feat/story-reactions

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.head_commit.message != 'TABLE STORIESリアクションを追加'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply reaction patch
        run: python scripts/apply_story_reactions_patch.py

      - name: Keep domain reaction type self-contained
        run: |
          cat > domain/story/game-story-reaction.ts <<'EOF'
          export const GAME_STORY_REACTION_TYPES = [
            "laugh",
            "fire",
            "shock",
            "nice",
            "respect",
          ] as const;

          export type GameStoryReactionType =
            (typeof GAME_STORY_REACTION_TYPES)[number];

          export function isGameStoryReactionType(
            value: string,
          ): value is GameStoryReactionType {
            return GAME_STORY_REACTION_TYPES.some((type) => type === value);
          }
          EOF
          cat > types/game-story-reaction.ts <<'EOF'
          import type { GameStoryReactionType } from "@domain/story/game-story-reaction";

          export type { GameStoryReactionType } from "@domain/story/game-story-reaction";

          export interface GameStoryReactionSummary {
            postId: string;
            type: GameStoryReactionType;
            count: number;
            reactedByCurrentPlayer: boolean;
          }
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m 'TABLE STORIESリアクションを追加'
          git push origin HEAD:feat/story-reactions
