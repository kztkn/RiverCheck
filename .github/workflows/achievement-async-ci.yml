name: Verify async achievement refresh

on:
  push:
    branches:
      - "feat/achievement-expansion-v1"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/achievement-expansion-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply async refresh changes
        run: python3 .github/scripts/async-achievement-refresh.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified implementation
        run: |
          rm .github/workflows/achievement-async-ci.yml
          rm .github/scripts/async-achievement-refresh.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "称号判定をバックグラウンド実行へ切り替え"
          git push origin HEAD:feat/achievement-expansion-v1
