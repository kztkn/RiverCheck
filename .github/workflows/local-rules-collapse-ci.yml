name: local-rules-collapse-ci

on:
  push:
    branches:
      - ui/collapse-local-rules

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/collapse-local-rules
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply patch
        run: python scripts/apply_local_rules_collapse.py
      - name: Remove temporary tooling
        run: rm scripts/apply_local_rules_collapse.py .github/workflows/local-rules-collapse-ci.yml
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "ローカルルール設定を折りたたみ表示 [skip ci]"
          git push origin HEAD:ui/collapse-local-rules
