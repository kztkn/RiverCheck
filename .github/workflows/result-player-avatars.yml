name: Verify result player avatars
on:
  push:
    branches: [feat/result-player-avatars-0912-finalwork]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Add result avatars
        run: |
          python3 <<'PY'
          from pathlib import Path

          repo = Path('server/repositories/finalization-repository.server.ts')
          s = repo.read_text()
          s = s.replace(
            '  cost_share: string;\n}',
            '  cost_share: string;\n  avatar_uploaded_at?: Date | null;\n}',
            1,
          )
          old = '''export async function listFinalResults(\n  groupId: string,\n  gameId: string,\n): Promise<GameResultSummary[]> {'''
          new = '''export async function listFinalResults(\n  groupId: string,\n  gameId: string,\n): Promise<Array<GameResultSummary & { avatarUpdatedAt: string | null }>> {'''
          if old not in s: raise SystemExit('listFinalResults signature not found')
          s = s.replace(old, new, 1)
          old = '''             game_result.settlement_rebuy_count,\n             game_result.score, game_result.rank, game_result.cost_share\n      FROM game_results AS game_result'''
          new = '''             game_result.settlement_rebuy_count,\n             game_result.score, game_result.rank, game_result.cost_share,\n             player.avatar_uploaded_at\n      FROM game_results AS game_result'''
          if old not in s: raise SystemExit('listFinalResults select not found')
          s = s.replace(old, new, 1)
          old = '''    rank: row.rank,\n    costShare: Number(row.cost_share),\n  }));\n}'''
          new = '''    rank: row.rank,\n    costShare: Number(row.cost_share),\n    avatarUpdatedAt: row.avatar_uploaded_at?.toISOString() ?? null,\n  }));\n}'''
          if old not in s: raise SystemExit('listFinalResults mapping not found')
          s = s.replace(old, new, 1)
          repo.write_text(s)

          route = Path('app/routes/game-participant.tsx')
          s = route.read_text()
          old = '''    results,\n    costShareReceipts,'''
          new = '''    results: results.map((result) => ({\n      ...result,\n      avatarUrl: buildPlayerAvatarUrl({\n        avatarUpdatedAt: result.avatarUpdatedAt,\n        groupCode: params.groupCode,\n        groupPlayerId: result.groupPlayerId,\n      }),\n    })),\n    costShareReceipts,'''
          if old not in s: raise SystemExit('results return not found')
          s = s.replace(old, new, 1)
          route.write_text(s)

          component = Path('app/components/final-results.tsx')
          s = component.read_text()
          if 'import { PlayerAvatar } from "./player-avatar";' not in s:
            s = s.replace(
              'import { ResultRevisionHistory } from "./result-revision-history";\n',
              'import { ResultRevisionHistory } from "./result-revision-history";\nimport { PlayerAvatar } from "./player-avatar";\n',
              1,
            )
          s = s.replace(
            '  results: GameResultSummary[];\n',
            '  results: Array<GameResultSummary & { avatarUrl?: string | null }>;\n',
            1,
          )
          old = '''          <div className="result-winner-copy">\n            <span>WINNER</span>\n            <strong>{winner.displayName}</strong>\n            <ResultParticipantMeta result={winner} />\n          </div>'''
          new = '''          <div className="result-winner-copy">\n            <span>WINNER</span>\n            <div className="result-winner-identity">\n              <PlayerAvatar\n                avatarUrl={winner.avatarUrl ?? null}\n                className="result-avatar result-winner-avatar"\n                displayName={winner.displayName}\n              />\n              <div className="result-winner-person">\n                <strong>{winner.displayName}</strong>\n                <ResultParticipantMeta result={winner} />\n              </div>\n            </div>\n          </div>'''
          if old not in s: raise SystemExit('winner block not found')
          s = s.replace(old, new, 1)
          old = '''            <span className={`rank-badge rank-${result.rank}`}>\n              {formatOrdinal(result.rank)}\n            </span>\n            <div className="result-player">'''
          new = '''            <span className={`rank-badge rank-${result.rank}`}>\n              {formatOrdinal(result.rank)}\n            </span>\n            <PlayerAvatar\n              avatarUrl={result.avatarUrl ?? null}\n              className="result-avatar"\n              displayName={result.displayName}\n            />\n            <div className="result-player">'''
          if old not in s: raise SystemExit('result row block not found')
          s = s.replace(old, new, 1)
          component.write_text(s)

          css = Path('app/styles/app.css')
          s = css.read_text()
          old = '''.result-winner-copy {\n  display: grid;\n  min-width: 0;\n  gap: 5px;\n}\n'''
          new = '''.result-winner-copy {\n  display: grid;\n  min-width: 0;\n  gap: 8px;\n}\n\n.result-winner-identity {\n  display: flex;\n  min-width: 0;\n  align-items: center;\n  gap: 13px;\n}\n\n.result-winner-person {\n  display: grid;\n  min-width: 0;\n  gap: 5px;\n}\n\n.result-winner-person > strong {\n  min-width: 0;\n  overflow-wrap: anywhere;\n  font-size: clamp(1.75rem, 7vw, 2.8rem);\n  line-height: 1.05;\n  letter-spacing: -0.055em;\n}\n\n.player-avatar.result-avatar {\n  width: 40px;\n  height: 40px;\n  flex: 0 0 40px;\n  border-radius: 10px;\n  font-size: 0.82rem;\n}\n\n.player-avatar.result-winner-avatar {\n  width: 54px;\n  height: 54px;\n  flex-basis: 54px;\n  border-radius: 12px;\n  font-size: 1rem;\n}\n'''
          if old not in s: raise SystemExit('winner css block not found')
          s = s.replace(old, new, 1)
          s = s.replace(
            '.result-panel .result-row {\n  grid-template-columns: 48px minmax(0, 1fr) auto;\n}',
            '.result-panel .result-row {\n  grid-template-columns: 48px 40px minmax(0, 1fr) auto;\n}',
            1,
          )
          s = s.replace(
            '  .result-panel .result-row {\n    grid-template-columns: 38px minmax(0, 1fr) auto;\n    gap: 8px;\n  }',
            '  .result-panel .result-row {\n    grid-template-columns: 38px 34px minmax(0, 1fr) auto;\n    gap: 8px;\n  }\n\n  .player-avatar.result-avatar {\n    width: 34px;\n    height: 34px;\n    flex-basis: 34px;\n    border-radius: 9px;\n  }\n\n  .player-avatar.result-winner-avatar {\n    width: 48px;\n    height: 48px;\n    flex-basis: 48px;\n    border-radius: 11px;\n  }',
            1,
          )
          css.write_text(s)

          Path('.github/workflows/result-player-avatars.yml').unlink()
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '結果画面にプレイヤー画像を表示'
          git push origin HEAD:feat/result-player-avatars-0912-finalwork
