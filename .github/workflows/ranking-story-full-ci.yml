name: ranking-story-full-ci

on:
  push:
    branches:
      - feat/ranking-story-ux-x
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ranking-story-ux-x
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python .github/scripts/apply-ranking-sort-button-css.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ranking-story-full-ci.yml .github/scripts/apply-ranking-sort-button-css.py
          git add app/styles/stats.css
          git commit -m "ランキングとストーリーUX修正フル検証完了"
          git push origin HEAD:feat/ranking-story-ux-x
