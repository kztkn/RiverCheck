name: Group membership edit verify

on:
  push:
    branches: [feat/group-membership-edit]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python scripts/apply-group-membership-edit.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified changes and remove temporary files
        run: |
          rm scripts/apply-group-membership-edit.py
          rm .github/workflows/group-membership-edit-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "グループ名と所属メンバーの編集を整備"
          git push
