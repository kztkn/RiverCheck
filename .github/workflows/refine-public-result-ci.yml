name: refine-public-result-ci

on:
  push:
    branches:
      - feat/invite-only-entry

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/invite-only-entry
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/refine-public-result-view.mjs
      - run: git diff --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit refined implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/site-menu.tsx app/components/final-results.tsx app/routes/game-participant.tsx app/routes/game-participant.test.ts app/routes/site-menu-access.test.ts docs/requirements.md docs/architecture.md
          git commit -m "公開結果URLを読み取り専用ビューへ調整"
          git push origin HEAD:feat/invite-only-entry
