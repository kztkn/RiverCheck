name: Update achievement docs

on:
  push:
    branches:
      - "feat/achievement-expansion-v1"

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/achievement-expansion-v1
      - name: Apply documentation changes
        run: python3 .github/scripts/update-achievement-docs.py
      - name: Check documentation diff
        run: git diff --check
      - name: Commit documentation
        run: |
          rm .github/workflows/achievement-docs-ci.yml
          rm .github/scripts/update-achievement-docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "称号拡張の仕様を正本文書へ反映"
          git push origin HEAD:feat/achievement-expansion-v1
