name: RiverCheck player surfaces verify

on:
  push:
    branches:
      - ui/rivercheck-player-surfaces

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python scripts/apply-rivercheck-player-surfaces.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified UI changes and remove temporary files
        run: |
          rm scripts/apply-rivercheck-player-surfaces.py
          rm .github/workflows/rivercheck-player-surfaces-verify.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "プレイヤー状態UIをRiverCheckらしく整理"
          git push origin HEAD:ui/rivercheck-player-surfaces
