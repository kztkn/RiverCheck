name: achievement-refresh-reliability

on:
  push:
    branches:
      - chatgpt/achievement-refresh-reliability-20260913

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/achievement-refresh-reliability-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 .github/achievement-refresh-apply.py
      - run: git diff --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated changes and remove temporary files
        shell: bash
        run: |
          git rm .github/workflows/achievement-refresh-reliability.yml .github/achievement-refresh-apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/repositories/achievement-repository.server.ts \
                  server/services/finalization-service.server.ts \
                  app/routes/achievement-repository.test.ts \
                  app/routes/game-finalized-notification.test.ts \
                  docs/requirements.md docs/architecture.md
          git commit -m "称号更新を確定後同期と自己修復に変更"
          git push origin HEAD:chatgpt/achievement-refresh-reliability-20260913
