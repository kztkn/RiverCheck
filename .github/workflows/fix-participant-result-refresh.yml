name: Fix participant result refresh UX
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply result refresh UX
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/routes/game-participant.tsx')
          s = p.read_text()
          s = s.replace('import { GameRefreshButton } from "~/components/game-refresh-button";\n', '')

          old = '''                <button\n                  className="button button-secondary"\n                  onClick={() => setIsEditing(true)}\n                  type="button"\n                >\n                  修正する\n                </button>\n                <GameRefreshButton>確定結果を確認する</GameRefreshButton>'''
          new = '''                <div className="submitted-input-actions">\n                  <button\n                    className="button button-secondary"\n                    onClick={() => setIsEditing(true)}\n                    type="button"\n                  >\n                    修正する\n                  </button>\n                  <FinalResultRefreshControl />\n                </div>'''
          assert old in s
          s = s.replace(old, new)

          marker = '''export function LocalRulesSheet({'''
          component = '''function FinalResultRefreshControl() {\n  const revalidator = useRevalidator();\n  const [isChecking, setIsChecking] = useState(false);\n  const [showPendingMessage, setShowPendingMessage] = useState(false);\n  const sawLoadingRef = useRef(false);\n\n  useEffect(() => {\n    if (!isChecking) return;\n    if (revalidator.state === "loading") {\n      sawLoadingRef.current = true;\n      return;\n    }\n    if (revalidator.state === "idle" && sawLoadingRef.current) {\n      sawLoadingRef.current = false;\n      setIsChecking(false);\n      setShowPendingMessage(true);\n    }\n  }, [isChecking, revalidator.state]);\n\n  return (\n    <>\n      <button\n        className="button button-secondary"\n        disabled={isChecking || revalidator.state !== "idle"}\n        onClick={() => {\n          setShowPendingMessage(false);\n          sawLoadingRef.current = false;\n          setIsChecking(true);\n          void revalidator.revalidate();\n        }}\n        type="button"\n      >\n        {isChecking ? "確認中…" : "結果画面へ"}\n      </button>\n      {showPendingMessage ? (\n        <p className="result-refresh-message" role="status">\n          まだ結果は確定していません。主催者が結果を確定したあと、もう一度お試しください。\n        </p>\n      ) : null}\n    </>\n  );\n}\n\n'''
          assert marker in s
          s = s.replace(marker, component + marker)
          p.write_text(s)

          css = Path('app/styles/app.css')
          c = css.read_text()
          addition = '''\n\n.submitted-input-actions {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 10px;\n}\n\n.submitted-input-actions > .button {\n  width: 100%;\n}\n\n.result-refresh-message {\n  grid-column: 1 / -1;\n  margin: 2px 0 0;\n  font-size: 0.84rem;\n  line-height: 1.55;\n  color: var(--muted);\n}\n'''
          if '.submitted-input-actions {' not in c:
            css.write_text(c.rstrip() + addition + '\n')

          test = Path('app/routes/participant-result-refresh-ui.test.ts')
          test.write_text('''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\n\ndescribe("participant result refresh UX", () => {\n  it("uses a result-screen CTA and explains when finalization is still pending", () => {\n    const source = readFileSync("app/routes/game-participant.tsx", "utf8");\n    expect(source).toContain("結果画面へ");\n    expect(source).toContain("まだ結果は確定していません。主催者が結果を確定したあと、もう一度お試しください。");\n    expect(source).toContain("submitted-input-actions");\n    expect(source).not.toContain("確定結果を確認する");\n  });\n});\n''')
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-participant-result-refresh.yml
          git add app
          git commit -m '参加者の結果確認導線を整理'
          git push origin HEAD:main