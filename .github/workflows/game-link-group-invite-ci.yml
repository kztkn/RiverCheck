name: game-link-group-invite-ci

on:
  push:
    branches:
      - feat/game-link-group-invite

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/patch-game-link-invite-server.mjs
      - run: node scripts/patch-game-link-invite-route.mjs
      - run: node scripts/patch-game-link-invite-tests-docs.mjs
      - run: git diff --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app server docs
          git commit -m "開催リンクから既存プロフィールでグループ参加 [skip ci]"
          git push
