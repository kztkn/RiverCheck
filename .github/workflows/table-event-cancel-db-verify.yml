name: Table event cancel DB verify

on:
  push:
    branches:
      - fix/table-event-cancel-2
    paths:
      - .github/workflows/table-event-cancel-db-verify.yml
      - scripts/apply-table-event-cancel-cast-fix.py

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rivercheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rivercheck"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/table-event-cancel-2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python scripts/apply-table-event-cancel-cast-fix.py
      - run: npm run db:migrate
      - run: node scripts/verify-table-event-cancel-db.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rivercheck
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified fix and remove temporary files
        run: |
          rm .github/workflows/table-event-cancel-db-verify.yml
          rm scripts/apply-table-event-cancel-cast-fix.py
          rm scripts/verify-table-event-cancel-db.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "卓イベント取消のnull型推論を修正"
          git push origin HEAD:fix/table-event-cancel-2
