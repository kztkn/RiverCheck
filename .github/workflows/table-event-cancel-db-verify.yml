name: Table event cancel DB verify

on:
  push:
    branches:
      - fix/table-event-cancel-2
    paths:
      - .github/workflows/table-event-cancel-db-verify.yml
      - scripts/verify-table-event-cancel-db.mjs

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rivercheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rivercheck"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/table-event-cancel-2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: node scripts/verify-table-event-cancel-db.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rivercheck
      - run: echo "PostgreSQL cancellation verification complete"
