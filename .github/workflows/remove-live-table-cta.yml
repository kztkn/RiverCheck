name: Remove duplicate LIVE TABLE CTA
on:
  push:
    branches:
      - "fix/remove-duplicate-live-table-cta"
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Remove CTA
        run: node -e "const fs=require('fs');const p='app/routes/group-top.tsx';let s=fs.readFileSync(p,'utf8');const a=s.indexOf('              <Link\\n                className=\"button button-primary home-game-primary-action\"');const b=s.indexOf('              </Link>\\n',a);if(a<0||b<0)process.exit(2);s=s.slice(0,a)+s.slice(b+'              </Link>\\n'.length);fs.writeFileSync(p,s);fs.unlinkSync('.github/workflows/remove-live-table-cta.yml')"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "トップのLIVE TABLE重複導線を整理"
          git push origin HEAD:fix/remove-duplicate-live-table-cta