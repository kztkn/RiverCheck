name: reopen-finalized-game-verify

on:
  push:
    branches:
      - feat/reopen-finalized-game

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rivercheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rivercheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reopen-finalized-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/apply-reopen-finalization.py
      - run: git diff --check
      - run: npm ci
      - run: npm run db:migrate:local
      - name: Database rollback-shape smoke test
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d rivercheck <<'SQL'
          DO $$
          DECLARE
            gid uuid := gen_random_uuid();
            gameid uuid := gen_random_uuid();
            pid uuid;
            gpid uuid;
            partid uuid;
            i integer;
          BEGIN
            INSERT INTO groups(id, name, public_code) VALUES (gid, 'Reopen Smoke', 'reopen-smoke');
            INSERT INTO games(
              id, group_id, title, played_at, status, initial_chips, rebuy_chips,
              venue_cost, rounding_unit, first_place_cost, second_place_cost,
              third_place_cost, preview_participant_count, finalized_at
            ) VALUES (
              gameid, gid, 'Smoke', NOW(), 'finalized', 20000, 20000,
              0, 100, 0, 0, 0, 4, NOW()
            );
            FOR i IN 1..4 LOOP
              pid := gen_random_uuid();
              gpid := gen_random_uuid();
              partid := gen_random_uuid();
              INSERT INTO players(id, display_name) VALUES (pid, 'P' || i);
              INSERT INTO group_players(id, group_id, player_id) VALUES (gpid, gid, pid);
              INSERT INTO game_participants(
                id, game_id, group_player_id, status, remaining_chips,
                settlement_rebuy_count, total_rebuy_count, outstanding_rebuy_count
              ) VALUES (partid, gameid, gpid, 'submitted', 20000, 0, 0, 0);
              INSERT INTO game_results(
                game_id, group_player_id, remaining_chips, settlement_rebuy_count,
                total_rebuy_count, tracked_outstanding_rebuy_count, score, rank, cost_share
              ) VALUES (gameid, gpid, 20000, 0, 0, 0, 20000, i, 0);
              IF i = 1 THEN
                INSERT INTO game_rebuy_events(
                  command_id, game_participant_id, event_type, total_delta,
                  outstanding_delta, recorded_by_type
                ) VALUES (gen_random_uuid(), partid, 'rebuy', 1, 1, 'participant');
              END IF;
            END LOOP;

            IF (SELECT COUNT(*) FROM game_results WHERE game_id = gameid) <> 4 THEN
              RAISE EXCEPTION 'expected 4 results before reopen';
            END IF;

            DELETE FROM game_results WHERE game_id = gameid;
            UPDATE games
            SET status = 'open', finalized_at = NULL, updated_at = NOW()
            WHERE id = gameid AND group_id = gid AND status = 'finalized';

            IF (SELECT COUNT(*) FROM game_results WHERE game_id = gameid) <> 0 THEN
              RAISE EXCEPTION 'results were not removed';
            END IF;
            IF (SELECT status FROM games WHERE id = gameid) <> 'open' THEN
              RAISE EXCEPTION 'game was not reopened';
            END IF;
            IF (SELECT finalized_at FROM games WHERE id = gameid) IS NOT NULL THEN
              RAISE EXCEPTION 'finalized_at was not cleared';
            END IF;
            IF (SELECT COUNT(*) FROM game_participants WHERE game_id = gameid) <> 4 THEN
              RAISE EXCEPTION 'participants should remain';
            END IF;
            IF (SELECT COUNT(*) FROM game_rebuy_events event JOIN game_participants participant ON participant.id = event.game_participant_id WHERE participant.game_id = gameid) <> 1 THEN
              RAISE EXCEPTION 'rebuy history should remain';
            END IF;
          END $$;
          SQL
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/routes/game-edit.tsx \
            app/routes/game-admin.tsx \
            app/routes/finalization-reopen.test.ts \
            app/routes/finalization-reopen-repository.test.ts \
            server/repositories/finalization-repository.server.ts \
            server/services/finalization-service.server.ts \
            docs/requirements.md \
            docs/domain-rules.md
          git commit -m "結果確定を安全に取り消せるようにする"
          git push origin HEAD:feat/reopen-finalized-game
