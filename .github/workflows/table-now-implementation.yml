name: Implement TABLE NOW

on:
  push:
    branches:
      - feat/table-now

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply TABLE NOW implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "server/repositories/participant-repository.server.ts",
              "export async function listCurrentGameParticipants(\n  groupId: string,\n  gameId: string,\n): Promise<CurrentGameParticipant[]> {\n",
              "export interface OpenGameTableEventCounts {\n  allInCount: number;\n  bombPotCount: number;\n  sevenDeuceCount: number;\n}\n\ninterface OpenGameTableEventCountRow {\n  all_in_count: number;\n  bomb_pot_count: number;\n  seven_deuce_count: number;\n}\n\nexport async function getOpenGameTableEventCounts(\n  groupId: string,\n  gameId: string,\n): Promise<OpenGameTableEventCounts> {\n  const result = await queryDatabase<OpenGameTableEventCountRow>(\n    `\n      SELECT\n        COUNT(*) FILTER (WHERE event.event_type = 'all_in')::int AS all_in_count,\n        COUNT(*) FILTER (WHERE event.event_type = 'bomb_pot')::int AS bomb_pot_count,\n        COUNT(*) FILTER (WHERE event.event_type = 'seven_deuce')::int AS seven_deuce_count\n      FROM game_table_events AS event\n      INNER JOIN games AS game ON game.id = event.game_id\n      WHERE game.id = $1\n        AND game.group_id = $2\n        AND game.status = 'open'\n        AND event.canceled_at IS NULL\n    `,\n    [gameId, groupId],\n  );\n  const row = result.rows[0];\n  return {\n    allInCount: row?.all_in_count ?? 0,\n    bombPotCount: row?.bomb_pot_count ?? 0,\n    sevenDeuceCount: row?.seven_deuce_count ?? 0,\n  };\n}\n\nexport async function listCurrentGameParticipants(\n  groupId: string,\n  gameId: string,\n): Promise<CurrentGameParticipant[]> {\n"
          )

          Path("app/components/table-now.tsx").write_text('''import { IconArrowUp, IconBomb, IconCards, IconUsers } from "@tabler/icons-react";\n\nexport interface TableNowData {\n  allInCount: number;\n  bombPotCount: number;\n  playerCount: number | null;\n  sevenDeuceCount: number;\n}\n\nexport function TableNow({ data }: { data: TableNowData }) {\n  const events = [\n    data.allInCount > 0\n      ? { key: "all-in", label: "ALL IN", value: data.allInCount, Icon: IconArrowUp }\n      : null,\n    data.bombPotCount > 0\n      ? { key: "bomb-pot", label: "BOMB POT", value: data.bombPotCount, Icon: IconBomb }\n      : null,\n    data.sevenDeuceCount > 0\n      ? { key: "seven-deuce", label: "72o", value: data.sevenDeuceCount, Icon: IconCards }\n      : null,\n  ].filter((item): item is NonNullable<typeof item> => item !== null);\n\n  return (\n    <section aria-label="いまの卓" className="table-now">\n      <div className="table-now-heading">\n        <span>TABLE NOW</span>\n        <small>いまの卓</small>\n      </div>\n      <div className="table-now-scroller">\n        <div className="table-now-item table-now-players">\n          <IconUsers aria-hidden="true" stroke={1.7} />\n          <span><strong>{data.playerCount ?? "—"}</strong><small>PLAYERS</small></span>\n        </div>\n        {events.map(({ key, label, value, Icon }) => (\n          <div className="table-now-item" key={key}>\n            <Icon aria-hidden="true" stroke={1.7} />\n            <span><small>{label}</small><strong>{value}</strong></span>\n          </div>\n        ))}\n      </div>\n    </section>\n  );\n}\n''')

          Path("app/styles/table-now.css").write_text('''.table-now { display:grid; gap:10px; margin:-2px 0 14px; padding:12px 0 10px; border-block:1px solid rgba(214,235,225,.1); }\n.table-now-heading { display:flex; align-items:baseline; gap:8px; padding-inline:2px; }\n.table-now-heading > span { color:rgba(231,244,237,.72); font-size:.68rem; font-weight:800; letter-spacing:.18em; }\n.table-now-heading > small { color:rgba(214,235,225,.42); font-size:.72rem; }\n.table-now-scroller { display:flex; gap:8px; overflow-x:auto; padding:1px 2px 5px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }\n.table-now-scroller::-webkit-scrollbar { display:none; }\n.table-now-item { display:inline-flex; flex:0 0 auto; align-items:center; gap:8px; min-height:44px; padding:7px 11px 7px 9px; border:1px solid rgba(214,235,225,.1); border-radius:14px; background:rgba(255,255,255,.025); }\n.table-now-item > svg { width:18px; height:18px; color:rgba(113,222,165,.72); }\n.table-now-item > span { display:flex; align-items:baseline; gap:6px; white-space:nowrap; }\n.table-now-item strong { color:#f2f7f4; font-size:.98rem; line-height:1; font-variant-numeric:tabular-nums; }\n.table-now-item small { color:rgba(224,238,231,.56); font-size:.66rem; font-weight:750; letter-spacing:.08em; }\n.table-now-players { border-color:rgba(57,222,141,.16); background:rgba(57,222,141,.045); }\n@media (min-width:700px) { .table-now-scroller { flex-wrap:wrap; overflow-x:visible; } }\n''')

          replace_once("app/root.tsx", 'import "./styles/table-events.css";\n', 'import "./styles/table-events.css";\nimport "./styles/table-now.css";\n')
          replace_once(
              "app/routes/game-participant.tsx",
              "  findParticipantByTokenHash,\n  joinAuthenticatedParticipant,\n",
              "  findParticipantByTokenHash,\n  getOpenGameTableEventCounts,\n  joinAuthenticatedParticipant,\n"
          )
          replace_once("app/routes/game-participant.tsx", 'import { INVITE_REQUIRED_RESPONSE_TEXT } from "@domain/routing/public-group-entry";\n', 'import { INVITE_REQUIRED_RESPONSE_TEXT } from "@domain/routing/public-group-entry";\nimport { TableNow } from "~/components/table-now";\n')
          replace_once("app/routes/game-participant.tsx", '  const [participant, participantRoster] = await Promise.all([\n', '  const [participant, participantRoster, tableEventCounts] = await Promise.all([\n')
          replace_once("app/routes/game-participant.tsx", '      : Promise.resolve({ available: true, participants: [] }),\n  ]);\n', '      : Promise.resolve({ available: true, participants: [] }),\n    context.game.status === "open"\n      ? getOpenGameTableEventCounts(context.group.id, params.gameId)\n      : Promise.resolve({ allInCount: 0, bombPotCount: 0, sevenDeuceCount: 0 }),\n  ]);\n')
          replace_once("app/routes/game-participant.tsx", '    participantRoster: {\n      available: participantRoster.available,\n', '    tableNow: context.game.status === "open"\n      ? {\n          playerCount: participantRoster.available\n            ? participantRoster.participants.length\n            : null,\n          ...tableEventCounts,\n        }\n      : null,\n    participantRoster: {\n      available: participantRoster.available,\n')
          replace_once("app/routes/game-participant.tsx", '      </section>\n\n      {shouldShowLocalRules(loaderData.game.status) ? (\n', '      </section>\n\n      {loaderData.tableNow ? <TableNow data={loaderData.tableNow} /> : null}\n\n      {shouldShowLocalRules(loaderData.game.status) ? (\n')

          replace_once("app/components/table-event-recorder.tsx", 'import { useLocation } from "react-router";\n', 'import { useLocation, useRevalidator } from "react-router";\n')
          replace_once("app/components/table-event-recorder.tsx", '  const location = useLocation();\n', '  const location = useLocation();\n  const revalidator = useRevalidator();\n')
          replace_once("app/components/table-event-recorder.tsx", '      await refreshPanel();\n', '      await refreshPanel();\n      void revalidator.revalidate();\n')

          replace_once("app/routes/game-participant.test.ts", '  findParticipantByTokenHash: vi.fn(),\n', '  findParticipantByTokenHash: vi.fn(),\n  getOpenGameTableEventCounts: vi.fn(),\n')
          replace_once("app/routes/game-participant.test.ts", '  findParticipantByTokenHash: mocked.findParticipantByTokenHash,\n', '  findParticipantByTokenHash: mocked.findParticipantByTokenHash,\n  getOpenGameTableEventCounts: mocked.getOpenGameTableEventCounts,\n')
          replace_once("app/routes/game-participant.test.ts", '    mocked.findParticipantByTokenHash.mockResolvedValue(null);\n', '    mocked.findParticipantByTokenHash.mockResolvedValue(null);\n    mocked.getOpenGameTableEventCounts.mockResolvedValue({\n      allInCount: 0,\n      bombPotCount: 0,\n      sevenDeuceCount: 0,\n    });\n')

          replace_once("docs/requirements.md", '- 最終更新: 2026-09-04\n', '- 最終更新: 2026-09-08\n')
          replace_once("docs/requirements.md", '14. リバイ・返済の成功後はリバイ操作欄内に直前の成功操作と「元に戻す」を表示する。時間経過では消さず、次の成功操作で置き換え、UNDO成功またはページ再読込・遷移で消える。失敗した操作では直前のUNDO対象を失わない\n', '14. リバイ・返済の成功後はリバイ操作欄内に直前の成功操作と「元に戻す」を表示する。時間経過では消さず、次の成功操作で置き換え、UNDO成功またはページ再読込・遷移で消える。失敗した操作では直前のUNDO対象を失わない\n15. open開催の参加者ページでは開催タイトル直下に「TABLE NOW / いまの卓」を表示し、現在参加中の人数を常時表示する。ALL IN・BOMB POT・72o成立は取消されていないテーブルイベントの累計が1件以上の項目だけ表示する。リバイ数は含めない。狭いスマートフォン幅では各指標を横スクロールでき、1項目内の不自然な改行を避ける。draft・finalizedでは表示しない。ページ表示・フォーカス復帰・pageshowおよびテーブルイベントの記録/取消後の既存loader再検証で最新値へ同期し、常時ポーリングやWebSocketは導入しない\n')

          Path("app/routes/table-now-ui.test.ts").write_text('''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\nconst participantRoute = readFileSync("app/routes/game-participant.tsx", "utf8");\nconst component = readFileSync("app/components/table-now.tsx", "utf8");\nconst styles = readFileSync("app/styles/table-now.css", "utf8");\ndescribe("TABLE NOW presentation", () => {\n  it("renders only for open games through loader data", () => {\n    expect(participantRoute).toContain('tableNow: context.game.status === "open"');\n    expect(participantRoute).toContain('<TableNow data={loaderData.tableNow} />');\n  });\n  it("keeps zero-count events out", () => {\n    expect(component).toContain("data.allInCount > 0");\n    expect(component).toContain("data.bombPotCount > 0");\n    expect(component).toContain("data.sevenDeuceCount > 0");\n  });\n  it("scrolls horizontally on narrow screens", () => {\n    expect(styles).toContain("overflow-x:auto");\n    expect(styles).toContain("white-space:nowrap");\n  });\n});\n''')
          Path("app/routes/table-now-repository.test.ts").write_text('''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\nconst source = readFileSync("server/repositories/participant-repository.server.ts", "utf8");\ndescribe("TABLE NOW repository", () => {\n  it("counts only active events on open games", () => {\n    expect(source).toContain("getOpenGameTableEventCounts");\n    expect(source).toContain("game.status = 'open'");\n    expect(source).toContain("event.canceled_at IS NULL");\n    expect(source).toContain("event.event_type = 'all_in'");\n    expect(source).toContain("event.event_type = 'bomb_pot'");\n    expect(source).toContain("event.event_type = 'seven_deuce'");\n  });\n});\n''')

          Path(".github/workflows/table-now-implementation.yml").unlink()
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TABLE NOWで開催中の卓状況を表示"
          git push origin HEAD:feat/table-now
