name: Confirm player selection validation

on:
  push:
    branches:
      - fix/confirm-player-selection

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/confirm-player-selection
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply confirmation UX
        shell: bash
        run: |
          cat > app/components/player-choice-list.tsx <<'EOF'
          import { Form } from "react-router";
          import { useEffect, useRef, useState } from "react";
          import { PlayerAvatar } from "~/components/player-avatar";

          type PlayerChoice = {
            id: string;
            displayName: string;
            avatarUrl: string | null;
          };

          export function buildPlayerJoinConfirmation(displayName: string) {
            return {
              description: `参加すると、この端末では${displayName}のプロフィールとしてログイン状態になります。`,
              title: `${displayName}として参加しますか？`,
            };
          }

          export function PlayerChoiceList({
            actionLabel,
            confirmBeforeSubmit = false,
            intent,
            isSubmitting,
            players,
            reloadDocument = false,
          }: {
            actionLabel: string;
            confirmBeforeSubmit?: boolean;
            intent: string;
            isSubmitting: boolean;
            players: PlayerChoice[];
            reloadDocument?: boolean;
          }) {
            const [selectedPlayer, setSelectedPlayer] = useState<PlayerChoice | null>(null);
            const dialogRef = useRef<HTMLDialogElement>(null);
            const triggerRef = useRef<HTMLButtonElement | null>(null);

            useEffect(() => {
              if (!confirmBeforeSubmit) return;
              const dialog = dialogRef.current;
              if (!dialog) return;
              if (selectedPlayer && !dialog.open) {
                dialog.showModal();
              } else if (!selectedPlayer && dialog.open) {
                dialog.close();
              }
            }, [confirmBeforeSubmit, selectedPlayer]);

            function closeDialog() {
              setSelectedPlayer(null);
            }

            function handleDialogClose() {
              setSelectedPlayer(null);
              triggerRef.current?.focus();
            }

            const confirmation = selectedPlayer
              ? buildPlayerJoinConfirmation(selectedPlayer.displayName)
              : null;

            return (
              <>
                <div className="player-choice-list">
                  {players.map((player) =>
                    confirmBeforeSubmit ? (
                      <button
                        aria-controls="player-choice-confirm-dialog"
                        aria-expanded={selectedPlayer?.id === player.id}
                        aria-haspopup="dialog"
                        aria-label={`${player.displayName}として${actionLabel}`}
                        className="player-choice-button"
                        disabled={isSubmitting}
                        key={player.id}
                        onClick={(event) => {
                          triggerRef.current = event.currentTarget;
                          setSelectedPlayer(player);
                        }}
                        type="button"
                      >
                        <PlayerAvatar
                          avatarUrl={player.avatarUrl}
                          displayName={player.displayName}
                        />
                        <span>{player.displayName}</span>
                        <small>{actionLabel}</small>
                      </button>
                    ) : (
                      <Form
                        className="player-choice-form"
                        key={player.id}
                        method="post"
                        reloadDocument={reloadDocument}
                      >
                        <input name="intent" type="hidden" value={intent} />
                        <input name="groupPlayerId" type="hidden" value={player.id} />
                        <button
                          aria-label={`${player.displayName}として${actionLabel}`}
                          className="player-choice-button"
                          disabled={isSubmitting}
                          type="submit"
                        >
                          <PlayerAvatar
                            avatarUrl={player.avatarUrl}
                            displayName={player.displayName}
                          />
                          <span>{player.displayName}</span>
                          <small>{actionLabel}</small>
                        </button>
                      </Form>
                    ),
                  )}
                </div>

                {confirmBeforeSubmit ? (
                  <dialog
                    aria-describedby="player-choice-confirm-description"
                    aria-labelledby="player-choice-confirm-title"
                    className="app-dialog"
                    id="player-choice-confirm-dialog"
                    onCancel={closeDialog}
                    onClick={(event) => {
                      if (event.target === event.currentTarget) closeDialog();
                    }}
                    onClose={handleDialogClose}
                    ref={dialogRef}
                  >
                    <div className="dialog-card">
                      {selectedPlayer && confirmation ? (
                        <>
                          <div className="participant-identity">
                            <PlayerAvatar
                              avatarUrl={selectedPlayer.avatarUrl}
                              displayName={selectedPlayer.displayName}
                            />
                            <div>
                              <p className="eyebrow">JOIN THE TABLE</p>
                              <h2 id="player-choice-confirm-title">
                                {confirmation.title}
                              </h2>
                            </div>
                          </div>
                          <p id="player-choice-confirm-description">
                            {confirmation.description}
                          </p>
                          <div className="dialog-actions">
                            <button
                              autoFocus
                              className="button button-secondary"
                              onClick={closeDialog}
                              type="button"
                            >
                              キャンセル
                            </button>
                            <Form method="post" reloadDocument={reloadDocument}>
                              <input name="intent" type="hidden" value={intent} />
                              <input
                                name="groupPlayerId"
                                type="hidden"
                                value={selectedPlayer.id}
                              />
                              <button
                                className="button button-primary"
                                disabled={isSubmitting}
                                type="submit"
                              >
                                {isSubmitting ? "参加中…" : "参加"}
                              </button>
                            </Form>
                          </div>
                        </>
                      ) : null}
                    </div>
                  </dialog>
                ) : null}
              </>
            );
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path('app/routes/game-participant.tsx')
          text = path.read_text()
          text = text.replace(
              '自分の名前を選ぶと、そのまま今回のゲームへ参加します。',
              '自分の名前を選び、確認して今回のゲームへ参加します。',
          )
          needle = '                    intent="join-existing"\n'
          if needle not in text:
              raise SystemExit('join-existing intent not found')
          text = text.replace(
              needle,
              '                    confirmBeforeSubmit\n' + needle,
              1,
          )
          path.write_text(text)

          path = Path('docs/requirements.md')
          text = path.read_text()
          needle = '2. 本人端末としてプロフィール認証済みの場合は「自分として参加」を押す。未認証の場合は登録済みプレイヤー一覧の自分の行にある「参加」を押す、または新しい名前を入力して「この名前で参加」を押す\n'
          replacement = needle + '   - 未認証で登録済みプレイヤーを選択した場合は「{表示名}として参加しますか？」の確認ダイアログを表示し、「参加」を押すまで参加登録とプロフィール認証を行わない。「キャンセル」では状態を変更しない\n'
          if needle not in text:
              raise SystemExit('requirements join step not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY

          cat > app/components/player-choice-list.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { buildPlayerJoinConfirmation } from "./player-choice-list";

          describe("player choice confirmation", () => {
            it("選択した本人名とログイン状態への影響を確認文に含める", () => {
              expect(buildPlayerJoinConfirmation("Alice")).toEqual({
                description:
                  "参加すると、この端末ではAliceのプロフィールとしてログイン状態になります。",
                title: "Aliceとして参加しますか？",
              });
            });
          });
          EOF
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Remove temporary validation workflow
        run: rm .github/workflows/confirm-player-selection-ci.yml
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/player-choice-list.tsx app/components/player-choice-list.test.ts app/routes/game-participant.tsx docs/requirements.md .github/workflows/confirm-player-selection-ci.yml
          git commit -m "参加者選択に確認ダイアログを追加"
          git push origin HEAD:fix/confirm-player-selection
