name: sequential-group-member-add-ci

on:
  push:
    branches:
      - fix/sequential-group-member-add

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run app/routes/reusable-player-picker.test.ts
