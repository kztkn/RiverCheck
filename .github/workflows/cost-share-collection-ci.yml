name: Cost share collection validation

on:
  push:
    branches:
      - fix/cost-share-collection-optimistic

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.head_commit.message != '会費回収の連続操作を高速化'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply patch
        run: python scripts/apply_cost_share_collection_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m '会費回収の連続操作を高速化'
          git push origin HEAD:fix/cost-share-collection-optimistic
