name: Verify permanent achievement reopen behavior

on:
  push:
    branches:
      - "feat/achievement-expansion-v1"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/achievement-expansion-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 .github/scripts/remove-reopen-achievement-refresh.py
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run app/routes/finalization-reopen.test.ts app/routes/finalization-reopen-repository.test.ts app/routes/game-finalized-notification.test.ts
      - name: Commit verified adjustment
        run: |
          rm .github/workflows/achievement-reopen-ci.yml
          rm .github/scripts/remove-reopen-achievement-refresh.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "確定取消では永久称号を再判定しない"
          git push origin HEAD:feat/achievement-expansion-v1
