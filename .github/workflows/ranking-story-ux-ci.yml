name: ranking-story-ux-ci

on:
  push:
    branches:
      - feat/ranking-story-ux-x

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'UX修正を検証') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python .github/scripts/apply-ranking-story-ux.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- app/routes/game-stories-ui.test.ts app/routes/player-stats-ranking-repository.test.ts
      - name: Commit verified changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ranking-story-ux-ci.yml .github/scripts/apply-ranking-story-ux.py
          git add app/components/game-stories.tsx app/routes/stats-index.tsx
          git commit -m "ランキング切替とストーリー保存UX修正を検証"
          git push origin HEAD:feat/ranking-story-ux-x
