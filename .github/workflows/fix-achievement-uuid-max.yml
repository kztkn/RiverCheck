name: Fix achievement UUID max

on:
  push:
    branches:
      - chatgpt/fix-achievement-uuid-max-20260914

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch UUID aggregate and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('server/repositories/achievement-repository.server.ts')
          text = repo.read_text()
          old = '''        MAX(game_id) FILTER (\n          WHERE reaction_number = 5\n        ) AS fifth_reacted_story_game_id'''
          new = '''        MAX(game_id::TEXT) FILTER (\n          WHERE reaction_number = 5\n        ) AS fifth_reacted_story_game_id'''
          if old not in text:
              raise SystemExit('target SQL not found')
          repo.write_text(text.replace(old, new, 1))

          test = Path('app/routes/achievement-repository.test.ts')
          text = test.read_text()
          old = '    expect(String(query.mock.calls[0]?.[0])).toContain("reaction_number = 5");\n'
          new = old + '    expect(String(query.mock.calls[0]?.[0])).toContain("MAX(game_id::TEXT)");\n'
          if old not in text:
              raise SystemExit('test insertion point not found')
          test.write_text(text.replace(old, new, 1))
          PY
      - run: npm run typecheck
      - run: npx vitest run app/routes/achievement-repository.test.ts
      - run: npm run build
      - name: Commit validated fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-achievement-uuid-max.yml
          git config user.name "kztkn"
          git config user.email "91022338+kztkn@users.noreply.github.com"
          git add server/repositories/achievement-repository.server.ts app/routes/achievement-repository.test.ts .github/workflows/fix-achievement-uuid-max.yml
          git commit -m "称号リアクション集計のUUIDエラーを修正"
          git push origin HEAD
