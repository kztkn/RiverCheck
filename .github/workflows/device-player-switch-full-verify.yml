name: device-player-switch-full-verify

on:
  push:
    branches:
      - feat/device-player-switch

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/device-player-switch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: git diff --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
