name: Verify achievement expansion

on:
  push:
    branches:
      - "feat/achievement-expansion-v1"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/achievement-expansion-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply changes
        run: |
          python3 .github/scripts/apply-achievement-expansion.py
          python3 .github/scripts/patch-achievement-tests.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified implementation
        run: |
          rm .github/workflows/achievement-expansion-ci.yml
          rm .github/scripts/apply-achievement-expansion.py
          rm .github/scripts/patch-achievement-tests.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "称号をテーブルイベントと交流データへ拡張"
          git push origin HEAD:feat/achievement-expansion-v1
