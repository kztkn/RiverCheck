name: Verify achievement expansion

on:
  push:
    branches: [feat/achievement-expansion-v1]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/achievement-expansion-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply remaining achievement changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"missing pattern in {path}: {old[:80]!r}")
              p.write_text(s.replace(old, new, 1))

          # Root: load unseen achievements for the authenticated group profile and render the toast globally.
          replace("app/root.tsx",
              'import { PwaUpdateNotice } from "~/components/pwa-update-notice";\n',
              'import { PwaUpdateNotice } from "~/components/pwa-update-notice";\nimport { AchievementUnlockToast } from "~/components/achievement-unlock-toast";\n')
          replace("app/root.tsx",
              'import { rememberLastVisitedGroup } from "~/utils/last-visited-group";\n',
              'import { rememberLastVisitedGroup } from "~/utils/last-visited-group";\nimport { getPendingPlayerAchievementNotifications } from "@server/services/achievement-service.server";\n')
          replace("app/root.tsx",
              '      hasMultipleGroups: false,\n      isOrganizer: false,\n',
              '      hasMultipleGroups: false,\n      isOrganizer: false,\n      pendingAchievementNotifications: [],\n')
          replace("app/root.tsx",
              '  const hasMultipleGroups = profile\n    ? await hasMultipleActiveGroupsForPlayer(profile.playerId)\n    : false;\n',
              '  const [hasMultipleGroups, pendingAchievementNotifications] = profile && overview\n    ? await Promise.all([\n        hasMultipleActiveGroupsForPlayer(profile.playerId),\n        getPendingPlayerAchievementNotifications(\n          overview.group.id,\n          profile.groupPlayerId,\n        ),\n      ])\n    : [false, []];\n')
          replace("app/root.tsx",
              '    hasMultipleGroups,\n    isOrganizer,\n',
              '    hasMultipleGroups,\n    isOrganizer,\n    pendingAchievementNotifications,\n')
          replace("app/root.tsx",
              '      <TableEventRecorder />\n',
              '      <TableEventRecorder />\n      {loaderData.activeGroupCode && loaderData.pendingAchievementNotifications.length > 0 ? (\n        <AchievementUnlockToast\n          groupCode={loaderData.activeGroupCode}\n          items={loaderData.pendingAchievementNotifications}\n          key={loaderData.pendingAchievementNotifications\n            .map((item) => item.playerAchievementId)\n            .join(":")}\n        />\n      ) : null}\n')

          # Resource route registration.
          replace("app/routes.ts",
              '  route("g/:groupCode/profile", "routes/player-profile.tsx"),\n',
              '  route("g/:groupCode/profile", "routes/player-profile.tsx"),\n  route(\n    "g/:groupCode/achievement-notifications",\n    "routes/achievement-notifications.ts",\n  ),\n')

          # Finalization: commit results first. Achievement failure must never roll back money/results.
          replace("server/services/finalization-service.server.ts",
              'import { awardAchievementsForPlayers } from "@server/services/achievement-service.server";\n',
              'import {\n  awardAchievementsForPlayers,\n  refreshAchievementsForPlayers,\n} from "@server/services/achievement-service.server";\n')
          replace("server/services/finalization-service.server.ts",
              '      notification: { playedAt: string; title: string };\n',
              '      notification: { playedAt: string; title: string };\n      achievementPlayerIds: string[];\n')
          replace("server/services/finalization-service.server.ts",
              '    await awardAchievementsForPlayers(\n      transaction,\n      group.id,\n      calculated.results.map((result) => result.groupPlayerId),\n    );\n    return {\n',
              '    return {\n')
          replace("server/services/finalization-service.server.ts",
              '      notification: {\n        playedAt: game.playedAt,\n        title: game.title,\n      },\n',
              '      notification: {\n        playedAt: game.playedAt,\n        title: game.title,\n      },\n      achievementPlayerIds: calculated.results.map(\n        (result) => result.groupPlayerId,\n      ),\n')
          replace("server/services/finalization-service.server.ts",
              '  if (!finalized.ok) return finalized;\n\n  try {\n    await notifyGameFinalized({\n',
              '  if (!finalized.ok) return finalized;\n\n  try {\n    await refreshAchievementsForPlayers(\n      group.id,\n      finalized.achievementPlayerIds,\n    );\n  } catch (error) {\n    console.error("Failed to refresh achievements after finalization", {\n      errorType: error instanceof Error ? error.name : "unknown",\n      gameId,\n    });\n  }\n\n  try {\n    await notifyGameFinalized({\n')

          # Reactions are optimistic in UI, so refresh the actor after a successful add without changing response semantics.
          replace("server/services/game-story-reaction-service.server.ts",
              'import type { GameStoryReactionSummary } from "@shared-types/game-story-reaction";\n',
              'import type { GameStoryReactionSummary } from "@shared-types/game-story-reaction";\nimport { refreshAchievementsForPlayers } from "@server/services/achievement-service.server";\n')
          replace("server/services/game-story-reaction-service.server.ts",
              '  return saved\n    ? { ok: true, ...saved }\n    : { ok: false, status: 404, error: "投稿を確認できませんでした。" };\n',
              '  if (!saved) {\n    return { ok: false, status: 404, error: "投稿を確認できませんでした。" };\n  }\n  if (saved.active) {\n    try {\n      await refreshAchievementsForPlayers(group.id, [groupPlayerId]);\n    } catch (error) {\n      console.error("Failed to refresh achievements after story reaction", {\n        errorType: error instanceof Error ? error.name : "unknown",\n        gameId: input.gameId,\n        groupPlayerId,\n      });\n    }\n  }\n  return { ok: true, ...saved };\n')

          # Story posts can immediately unlock 1/3/5 milestones for authenticated profiles.
          replace("app/routes/game-participant.tsx",
              'import { listOpenGameTableEvents } from "@server/repositories/table-event-repository.server";\n',
              'import { listOpenGameTableEvents } from "@server/repositories/table-event-repository.server";\nimport { refreshAchievementsForPlayers } from "@server/services/achievement-service.server";\n')
          replace("app/routes/game-participant.tsx",
              '    if (!result.ok) return { error: result.error };\n    return redirect(\n      `${participantUrl}?notice=${isDeletingOwnStory ? "story-deleted" : "story-saved"}`,\n',
              '    if (!result.ok) return { error: result.error };\n    if (groupPlayerId && !isDeletingOwnStory) {\n      try {\n        await refreshAchievementsForPlayers(context.group.id, [groupPlayerId]);\n      } catch (error) {\n        console.error("Failed to refresh achievements after story post", {\n          errorType: error instanceof Error ? error.name : "unknown",\n          gameId: params.gameId,\n          groupPlayerId,\n        });\n      }\n    }\n    return redirect(\n      `${participantUrl}?notice=${isDeletingOwnStory ? "story-deleted" : "story-saved"}`,\n')

          # Achievement toast styling: same dark felt/gold visual language, Tabler icon rather than emoji.
          with Path("app/styles/app.css").open("a") as f:
              f.write(r'''

.achievement-unlock-toast {
  width: min(calc(100% - 32px), 420px);
  align-items: center;
  gap: 12px;
  border-color: rgba(233, 186, 90, 0.38);
  background:
    radial-gradient(circle at 8% 20%, rgba(233, 186, 90, 0.12), transparent 42%),
    #102119;
}

.achievement-unlock-toast > span:first-child {
  border: 1px solid rgba(233, 186, 90, 0.42);
  background: rgba(233, 186, 90, 0.1);
  color: var(--gold);
}

.achievement-unlock-toast > span:first-child svg {
  width: 16px;
  height: 16px;
  stroke-width: 1.8;
}

.achievement-unlock-toast-copy {
  display: grid !important;
  width: auto !important;
  height: auto !important;
  min-width: 0;
  flex: 1 1 auto !important;
  place-items: initial !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  color: inherit !important;
  gap: 2px;
  text-align: left;
}

.achievement-unlock-toast-copy small {
  color: var(--gold);
  font-size: 0.58rem;
  font-weight: 900;
  letter-spacing: 0.14em;
}

.achievement-unlock-toast-copy strong {
  overflow: hidden;
  font-size: 0.9rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.achievement-unlock-toast-copy em {
  overflow: hidden;
  color: var(--muted);
  font-size: 0.68rem;
  font-style: normal;
  text-overflow: ellipsis;
  white-space: nowrap;
}
''')

          # Evaluator tests: extend fixture and add the chosen milestones.
          p = Path("domain/achievement/evaluate-achievements.test.ts")
          s = p.read_text()
          s = s.replace(
              '    settlementRebuyCount: 0,\n    ...overrides,\n',
              '    settlementRebuyCount: 0,\n    sevenDeuceCount: 0,\n    allInWinCount: 0,\n    allInLossCount: 0,\n    storyPostCount: 0,\n    ...overrides,\n',
              1,
          )
          s += r'''

describe("追加称号", () => {
  it("72oを1・3・5回で段階的に解除する", () => {
    const unlocks = evaluateAchievements([
      game("g1", { sevenDeuceCount: 1 }),
      game("g2", { sevenDeuceCount: 2 }),
      game("g3", { sevenDeuceCount: 2 }),
    ]);
    expect(unlocks).toEqual(expect.arrayContaining([
      { code: "seven-deuce-first", sourceGameId: "g1" },
      { code: "seven-deuce-three", sourceGameId: "g2" },
      { code: "seven-deuce-five", sourceGameId: "g3" },
    ]));
  });

  it("ALL INの勝敗を別々に5回で解除する", () => {
    const unlocks = evaluateAchievements([
      game("g1", { allInWinCount: 2, allInLossCount: 1 }),
      game("g2", { allInWinCount: 3, allInLossCount: 4 }),
    ]);
    expect(unlocks).toEqual(expect.arrayContaining([
      { code: "all-in-five-wins", sourceGameId: "g2" },
      { code: "all-in-five-losses", sourceGameId: "g2" },
    ]));
  });

  it("リバイ通算10回と1開催3回を別条件で解除する", () => {
    const unlocks = evaluateAchievements([
      game("g1", { totalRebuyCount: 3 }),
      game("g2", { totalRebuyCount: 4 }),
      game("g3", { totalRebuyCount: 3 }),
    ]);
    expect(unlocks).toEqual(expect.arrayContaining([
      { code: "rebuy-triple", sourceGameId: "g1" },
      { code: "rebuy-ten", sourceGameId: "g3" },
    ]));
  });

  it("TABLE STORIESを1・3・5投稿で段階的に解除する", () => {
    const unlocks = evaluateAchievements([
      game("g1", { storyPostCount: 1 }),
      game("g2", { storyPostCount: 1 }),
      game("g3", { storyPostCount: 1 }),
      game("g4", { storyPostCount: 1 }),
      game("g5", { storyPostCount: 1 }),
    ]);
    expect(unlocks).toEqual(expect.arrayContaining([
      { code: "story-first", sourceGameId: "g1" },
      { code: "story-three", sourceGameId: "g3" },
      { code: "story-five", sourceGameId: "g5" },
    ]));
  });

  it("5件の異なる投稿へのリアクションで愛を配る者を解除する", () => {
    const unlocks = evaluateAchievements(
      [game("played")],
      { reactedStoryPostCount: 5, fifthReactedStoryGameId: "reacted-game" },
    );
    expect(unlocks).toContainEqual({
      code: "love-giver",
      sourceGameId: "reacted-game",
    });
  });

  it("+200BBと-200BBを両方経験するとジェットコースターを解除する", () => {
    const unlocks = evaluateAchievements([
      game("g1", { netBb: 220 }),
      game("g2", { netBb: -210 }),
    ]);
    expect(unlocks).toContainEqual({
      code: "rollercoaster",
      sourceGameId: "g2",
    });
  });
});
'''
          p.write_text(s)

          # Repository unit tests now assert fixed-round-trip aggregation + append-only award inserts.
          Path("app/routes/achievement-repository.test.ts").write_text(r'''import { describe, expect, it, vi } from "vitest";

vi.mock("@server/db/client.server", () => ({
  queryDatabase: vi.fn(),
}));

import {
  insertAchievementUnlocks,
  listAchievementHistoryGames,
  listAchievementReactionSummaries,
} from "@server/repositories/achievement-repository.server";
import type { DatabaseTransaction } from "@server/db/client.server";

function transactionWith(query: ReturnType<typeof vi.fn>): DatabaseTransaction {
  return { query } as unknown as DatabaseTransaction;
}

describe("achievement repository", () => {
  it("inserts evaluated unlocks in one append-only query", async () => {
    const query = vi.fn().mockResolvedValue({ rows: [] });
    await insertAchievementUnlocks(transactionWith(query), "group-1", [
      {
        groupPlayerId: "00000000-0000-4000-8000-000000000001",
        unlock: {
          code: "seven-deuce-first",
          sourceGameId: "00000000-0000-4000-8000-000000000010",
        },
      },
      {
        groupPlayerId: "00000000-0000-4000-8000-000000000001",
        unlock: {
          code: "story-first",
          sourceGameId: "00000000-0000-4000-8000-000000000010",
        },
      },
    ]);
    expect(query).toHaveBeenCalledTimes(1);
    expect(query.mock.calls[0]?.[0]).toContain("jsonb_to_recordset");
    expect(query.mock.calls[0]?.[0]).toContain("ON CONFLICT (group_player_id, achievement_id) DO NOTHING");
    expect(query.mock.calls[0]?.[0]).not.toContain("DELETE FROM player_achievements");
  });

  it("loads finalized result, table-event, and story facts in one history query", async () => {
    const query = vi.fn().mockResolvedValue({
      rows: [{
        group_player_id: "player-1",
        game_id: "game-1",
        rank: 2,
        participant_count: "5",
        net_bb: "25",
        initial_chips: "20000",
        total_rebuy_count: null,
        tracked_outstanding_rebuy_count: null,
        settlement_rebuy_count: 1,
        seven_deuce_count: 2,
        all_in_win_count: 1,
        all_in_loss_count: 3,
        story_post_count: 1,
      }],
    });
    await expect(listAchievementHistoryGames(
      transactionWith(query),
      "group-1",
      ["player-1"],
    )).resolves.toEqual([{
      groupPlayerId: "player-1",
      gameId: "game-1",
      rank: 2,
      participantCount: 5,
      netBb: 25,
      totalRebuyCount: 1,
      outstandingRebuyCount: null,
      settlementRebuyCount: 1,
      sevenDeuceCount: 2,
      allInWinCount: 1,
      allInLossCount: 3,
      storyPostCount: 1,
    }]);
    const sql = String(query.mock.calls[0]?.[0]);
    expect(sql).toContain("seven_deuce_metrics");
    expect(sql).toContain("all_in_metrics");
    expect(sql).toContain("story_metrics");
    expect(sql).toContain("event.canceled_at IS NULL");
  });

  it("counts reactions by distinct story post and keeps the fifth source game", async () => {
    const query = vi.fn().mockResolvedValue({
      rows: [{
        group_player_id: "player-1",
        reacted_story_post_count: 5,
        fifth_reacted_story_game_id: "game-5",
      }],
    });
    await expect(listAchievementReactionSummaries(
      transactionWith(query),
      "group-1",
      ["player-1"],
    )).resolves.toEqual([{
      groupPlayerId: "player-1",
      reactedStoryPostCount: 5,
      fifthReactedStoryGameId: "game-5",
    }]);
    const sql = String(query.mock.calls[0]?.[0]);
    expect(sql).toContain("GROUP BY");
    expect(sql).toContain("reaction_number = 5");
  });
});
''')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/achievement-expansion-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "称号をテーブルイベントと交流データへ拡張"
          git push origin HEAD:feat/achievement-expansion-v1
