services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rivercheck
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rivercheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - rivercheck_postgres_data:/var/lib/postgresql/data

volumes:
  rivercheck_postgres_data:
